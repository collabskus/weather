name: dependency-review

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v6

      # Flags dependency changes in a PR that introduce known-vulnerable
      # packages or disallowed licences before they land.
      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
