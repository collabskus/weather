name: format

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  format:
    name: dotnet format (verify)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Fails the build if any file isn't formatted to the .editorconfig rules.
      - name: Verify formatting
        run: dotnet format weather.slnx --verify-no-changes --severity info
