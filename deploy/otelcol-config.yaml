# ============================================================================
# OpenTelemetry Collector — vendor-neutral fan-out.
#
# Receives OTLP from the Weather services and forwards every signal to BOTH:
#   * the standalone Aspire dashboard (for local, live inspection), and
#   * Uptrace (a hosted, OTLP-native backend).
#
# This is the seam that makes the backend swappable: the .NET apps only know
# "send OTLP to the collector"; switching or adding a destination is a change
# here, not in application code. The Uptrace DSN comes from the UPTRACE_DSN
# environment variable (see deploy/.env.example).
# ============================================================================

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s

exporters:
  # Local Aspire dashboard OTLP ingress (gRPC, in-cluster, no TLS).
  otlp/aspire:
    endpoint: aspire-dashboard:18889
    tls:
      insecure: true

  # Uptrace (hosted). Authenticates with the uptrace-dsn header; gzip + TLS.
  otlp/uptrace:
    endpoint: api.uptrace.dev:4317
    headers:
      uptrace-dsn: ${env:UPTRACE_DSN}
    compression: gzip

  # Helpful while wiring things up; comment out for quieter logs.
  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/aspire, otlp/uptrace]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/aspire, otlp/uptrace]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/aspire, otlp/uptrace]
  telemetry:
    logs:
      level: info
